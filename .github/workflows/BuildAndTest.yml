name: Build and Test — TodoApi

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'TodoApi/**'
      - 'TodoApi.Tests/**'
      - '.github/workflows/build-and-test.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'TodoApi/**'
      - 'TodoApi.Tests/**'
      - '.github/workflows/build-and-test.yml'

env:
  DOTNET_VERSION: '8.0.x'
  BUILD_CONFIGURATION: Release

jobs:
  build-and-test:
    name: Build & Test (.NET ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── .NET setup ───────────────────────────────────────────────────────────
      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ── Cache NuGet packages ──────────────────────────────────────────────────
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # ── Restore ───────────────────────────────────────────────────────────────
      - name: Restore dependencies
        run: dotnet restore TodoApi/TodoApi.csproj

      - name: Restore test dependencies
        run: dotnet restore TodoApi.Tests/TodoApi.Tests.csproj

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build API
        run: >
          dotnet build TodoApi/TodoApi.csproj
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-restore
          --nologo

      - name: Build Tests
        run: >
          dotnet build TodoApi.Tests/TodoApi.Tests.csproj
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-restore
          --nologo

      # ── Test with coverage ────────────────────────────────────────────────────
      - name: Run unit tests
        run: >
          dotnet test TodoApi.Tests/TodoApi.Tests.csproj
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build
          --nologo
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      # ── Publish test results ──────────────────────────────────────────────────
      - name: Publish test results
        uses: dorny/tests-reporter@v1
        if: always()
        with:
          name: xUnit Tests (${{ matrix.os }})
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: true

      # ── Upload coverage report ────────────────────────────────────────────────
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: TestResults/**/coverage.cobertura.xml
          flags: unittests
          name: TodoApi-coverage
          fail_ci_if_error: false   # don't fail the build if Codecov is unreachable
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # ── Upload raw artifacts ──────────────────────────────────────────────────
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          retention-days: 14

  # ── Code quality check ────────────────────────────────────────────────────────
  lint:
    name: Format & Style Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: |
          dotnet restore TodoApi/TodoApi.csproj
          dotnet restore TodoApi.Tests/TodoApi.Tests.csproj

      - name: Check code formatting
        run: >
          dotnet format TodoApi/TodoApi.csproj
          --verify-no-changes
          --severity warn
          --no-restore

  # ── Summary badge ─────────────────────────────────────────────────────────────
  # Depends on both jobs so the repo-level status check is a single gate
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [ build-and-test, lint ]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.build-and-test.result }}" != "success" ]]; then
            echo "build-and-test failed: ${{ needs.build-and-test.result }}"
            exit 1
          fi
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "lint failed: ${{ needs.lint.result }}"
            exit 1
          fi
          echo "All jobs passed ✓"